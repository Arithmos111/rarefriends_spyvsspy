# The Rare Agency on a single VPS, with automatic TLS.
#
#   cp .env.example .env     # set DOMAIN to a name pointing at this machine
#   docker compose up -d --build
#
# One app container and one reverse proxy. Do not scale the game service: lobbies and live
# matches are held in process memory, so a second replica would serve a second, disconnected
# lobby list and players would fail to find each other.

services:
  game:
    build: .
    image: rare-agency:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # Career standings live here. Keep the volume below or they reset on every redeploy.
      RF_DATA_DIR: /data
      # Listed without a value so Compose passes it through only when it is actually set.
      # `RF_GENESIS_ADDRESS: ${RF_GENESIS_ADDRESS:-}` would always define it, and an empty
      # value means "switch the Genesis perk off", so the default would silently disable it.
      RF_GENESIS_ADDRESS:
    volumes:
      # Deliberately still named embassy_data. Compose derives the real volume name from
      # this key, so renaming it would create an empty volume and orphan the career
      # standings already on any deployed host. The name is cosmetic; the data is not.
      - embassy_data:/data
    # Reachable only from the proxy, never published straight to the internet.
    expose:
      - "8080"
    networks:
      - agency

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to the hostname players will visit}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, so keep it.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - agency

volumes:
  caddy_data:
  caddy_config:
  # The leaderboard's JSON file. Losing this volume wipes every career total.
  embassy_data:

networks:
  agency:
